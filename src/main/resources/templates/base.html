<!doctype html>
<html lang="fr" th:fragment="layout(titre,contenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:replace="${titre}">Chatbot</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-danger">
            Déconnexion
        </button>
    </form>



    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">



</head>
<body>
<div class="min-vh-100">
    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
                    <use xlink:href="#bootstrap"></use>
                </svg>
            </a>
                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="#" class="nav-link px-2 text-secondary">Home</a></li>

                    <!-- Nouvelle conversation -->
                    <a th:href="@{/}" class="btn nav-link btn-outline-light w-100 mb-4">
                        + Nouvelle conversation
                    </a>

                    <h6 class="text-secondary">Historique</h6>
                    <div class="list-group">
                        <a th:each="c : ${conversations}"
                           th:href="@{/conversations/{id}(id=${c.id})}"
                           th:text="${c.titre}"
                           class="list-group-item list-group-item-action nav-link"
                           th:classappend="${conversation != null and conversation.id == c.id} ? 'active' : ''">
                        </a>
                    </div>
                </ul>
                <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search"><input type="search"
                                                                                           class="form-control form-control-dark text-bg-dark"
                                                                                           placeholder="Search..."
                                                                                           aria-label="Search"></form>
                <div class="text-end">
                    <button type="button" class="btn btn-outline-light me-2">Login</button>
                    <button type="button" class="btn btn-warning">Sign-up</button>
                </div>
            </div>
        </div>
    </header>
    <main th:replace="${contenu}" class="container">

    </main>
</div>
<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"><p
        class="col-md-4 mb-0 text-body-secondary">© 2026 Company, Inc</p> <a href="/"
                                                                             class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
                                                                             aria-label="Bootstrap">
    <svg class="bi me-2" width="40" height="32" aria-hidden="true">
        <use xlink:href="#bootstrap"></use>
    </svg>
</a>
    <ul class="nav col-md-4 justify-content-end">
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Home</a></li>
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Features</a></li>
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Pricing</a></li>
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">FAQs</a></li>
        <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
    </ul>
</footer>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
